schema_version: 1
name: aflow-table1-smoke
model_config: models/openrouter_deepseek_chat.yaml
seed: 42
test_repeats: 1
sample_limit: 3
datasets: [hotpotqa, drop, humaneval, mbpp, gsm8k, math]
methods: [io, cot_sc, adas, aflow]
aflow:
  max_rounds: 1
  validation_rounds: 1
  top_k: 1
