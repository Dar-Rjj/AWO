[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awo"
version = "0.1.0"
description = "Controlled reproduction of AFlow Table 1 with OpenRouter DeepSeek Chat"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RJJ" }]
dependencies = [
  "gdown==5.2.0",
  "numpy==2.0.2",
  "openai==1.82.0",
  "pandas==2.2.3",
  "pydantic==2.11.5",
  "PyYAML==6.0.2",
  "requests==2.32.4",
  "sympy==1.14.0",
  "tenacity==9.1.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
  "pip==25.2",
  "pip-tools==7.5.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
  "setuptools==80.9.0",
  "wheel==0.45.1",
]

[project.scripts]
awo = "awo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
